<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoMap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<style>
:root{font:14px system-ui,sans-serif;color:#222}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,255px);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
header{grid-column:1;grid-row:1;min-width:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;min-height:58px;background:white}
button{font:inherit;cursor:pointer;border:1px solid #bbb;background:#fff;border-radius:6px;padding:7px 12px}
button:hover{background:#f0f0f0}button:disabled{opacity:.5;cursor:wait}
#recentFolders{font:inherit;max-width:200px;padding:7px 8px;border:1px solid #bbb;border-radius:6px;background:white}#recentFolders[hidden],#restorePrompt[hidden],#choosePrompt[hidden]{display:none}
#restorePrompt,#choosePrompt{position:relative;display:inline-flex;align-items:center;flex:none}
#restoreLast{display:inline-flex;align-items:center;gap:8px;border:1px solid #1459b8;background:#1769d2;color:#fff;font-weight:700;padding:9px 15px;box-shadow:0 2px 8px #1769d244;white-space:nowrap}
#restoreLast:hover{background:#1259b5}
#restoreLast:focus-visible{outline:3px solid #80b8ff;outline-offset:3px}
#restoreLast:disabled{opacity:.7;cursor:wait}
#restoreLast svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#restoreBubble,#chooseBubble{position:absolute;z-index:110;top:calc(100% + 13px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(320px,85vw);padding:11px 14px;border-radius:9px;background:#202937;color:#fff;box-shadow:0 6px 25px #0005;font-size:13px;line-height:1.45;white-space:normal;pointer-events:none}
#restoreBubble::before,#chooseBubble::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:#202937}
#chooseBubble{left:0;transform:none}
#chooseBubble::before{left:75px;transform:translateX(-50%)}
#restoreBubble strong,#chooseBubble strong{display:block;overflow-wrap:anywhere;font-weight:650}
#restoreBubble span,#chooseBubble span{display:block;color:#dae4f3;margin-top:3px}
@media(max-width:650px){#restoreBubble{left:0;transform:none}#restoreBubble::before,#chooseBubble::before{left:25px;transform:none}}
#concurrency,#thumbSize,#thumbQuality{font:inherit;padding:7px 8px;border:1px solid #bbb;border-radius:6px;background:white}label[for="concurrency"],label[for="thumbSize"],label[for="thumbQuality"]{white-space:nowrap}
#status{color:#555;flex:1;min-width:190px}
#workspace{display:contents}
#map{grid-column:1;grid-row:2;min-width:0;min-height:0;width:100%;height:100%}
#folders{grid-column:2;grid-row:1 / 3;width:100%;min-width:0;border-left:1px solid #ddd;background:#fafafa;display:flex;flex-direction:column;min-height:0}
#folderTitle{padding:8px 12px;min-height:58px;font-weight:650;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:8px}
#folderTitleLabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#folderList{overflow:auto;flex:1;padding:6px}
.folder-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:5px;width:100%;padding:8px;min-height:38px}
/* Folder scan states: pending / processing / completed. */
.folder-btn.pending{color:#9299a4;background:#f0f1f3}
.folder-btn.pending .folder-count{color:#a4aab2}
.folder-btn.processing{color:#155eac;background:#e8f1fe}
.folder-btn.processing .folder-count{color:#3775b3}
.folder-btn:hover{background:#e8edf3}
.folder-btn.active{background:#dce9fd;color:#174b94;font-weight:600}
.folder-btn.active.pending{background:#e9ecf1;color:#737e8c}
.folder-btn.active.processing{background:#d8eafe;color:#174b94}
.folder-btn .folder-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.folder-btn .folder-count{font-size:12px;color:#666;flex:none;font-variant-numeric:tabular-nums}
.folder-entry{margin-bottom:2px}
.folder-progress{margin:0 9px 7px;height:5px;border-radius:999px;background:#dce3ec;overflow:hidden}
.folder-progress-fill{height:100%;width:0;background:#3984e6;border-radius:inherit;transition:width .12s ease}
.folder-progress-label{padding:0 9px 4px;font-size:11px;color:#526477;font-variant-numeric:tabular-nums}
.folder-progress[hidden],.folder-progress-label[hidden]{display:none}
#folderHint{font-size:12px;color:#666;padding:10px;border-top:1px solid #ddd}

.popup{background:white;border-radius:10px;padding:10px;box-shadow:0 4px 18px #0005;text-align:center;min-width:120px}
.popup img{display:block;max-width:320px;max-height:320px;object-fit:contain;cursor:zoom-in;margin:auto}
.popup .date{margin-top:6px;color:#444}
.popup{position:relative;min-width:180px;max-width:min(370px,90vw)}
.popup-main{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.popup-main img{max-width:min(300px,65vw);max-height:320px;min-width:0}
.popup-arrow{font-size:26px;line-height:1;padding:3px 9px;flex:none}
.popup-close{position:absolute;right:4px;top:3px;border:0;background:transparent;font-size:22px;line-height:1;padding:3px 7px;color:#444}
.popup .date{padding:0 8px;overflow-wrap:anywhere;font-size:13px;line-height:1.35}
.popup-count{font-size:12px;color:#777;margin-top:4px}
.popup-footer{margin-top:9px;display:flex;flex-direction:column;align-items:center;gap:2px}
#viewer{position:fixed;inset:0;background:#000e;z-index:1000;display:none;align-items:center;justify-content:center;color:white}
#viewer.visible{display:flex}
#viewerStage{position:relative;display:flex;align-items:center;justify-content:center;width:calc(100vw - 105px);height:calc(100dvh - 100px);min-height:100px}
#viewerStage .viewer-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-out;opacity:0;visibility:hidden;transition:opacity .26s ease;pointer-events:none}
#viewerStage .viewer-photo.active{opacity:1;visibility:visible;pointer-events:auto}
#viewerStage .viewer-photo.fading-out{opacity:0;visibility:visible;pointer-events:none}
@media(prefers-reduced-motion:reduce){#viewerStage .viewer-photo{transition:none}}
#viewerCaption{position:absolute;bottom:12px;left:62px;right:62px;text-align:center;pointer-events:none}
#viewerLoading{z-index:1;position:absolute;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;background:#0003}
#viewerLoading[hidden],#viewerError[hidden]{display:none}
.spinner{width:48px;height:48px;border-radius:50%;border:5px solid #ffffff57;border-top-color:#fff;animation:spin .8s linear infinite;filter:drop-shadow(0 2px 5px #0008)}
@keyframes spin{to{transform:rotate(360deg)}}
#viewerError{position:absolute;max-width:min(480px,75vw);padding:16px;border-radius:8px;background:#242424e8;text-align:center;overflow-wrap:anywhere}
.vbtn{position:absolute;color:white;background:#333a;border:1px solid #7778;border-radius:8px;padding:6px 13px;font-size:32px;line-height:1.1;z-index:2}
.vbtn:hover{background:#555d}.vbtn:disabled{opacity:.3}.prev{left:12px;top:50%;transform:translateY(-50%)}.next{right:12px;top:50%;transform:translateY(-50%)}
#download{top:15px;right:76px;width:45px;height:43px;padding:7px;display:flex;align-items:center;justify-content:center}
#download svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.close{top:15px;right:18px;font-size:27px}
@media(max-width:650px){body{grid-template-columns:minmax(0,1fr) 145px}header{min-height:unset}#folders{width:100%}.folder-btn{padding:7px 4px}#viewerStage{width:calc(100vw - 72px);height:calc(100dvh - 100px)}.vbtn{padding:4px 8px;font-size:25px}.prev{left:4px}.next{right:4px}}
#deletePhoto{top:15px;right:76px;width:45px;height:43px;padding:7px;display:flex;align-items:center;justify-content:center}
#deletePhoto svg,.popup-delete svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#download{right:134px}
.popup-delete{position:absolute;right:39px;top:3px;border:0;background:transparent;padding:4px 6px;display:flex;align-items:center;justify-content:center;color:#a93232}
.popup-delete:hover{background:#ffebeb}
#deletePhoto[hidden],.popup-delete[hidden]{display:none!important}
body:not(.local-mode) #deletePhoto{display:none}
#controlsToggle{display:none;flex:none;width:36px;height:36px;padding:7px;background:#fff;box-shadow:none;border:1px solid #bbb;border-radius:6px}
#controlsToggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
body.http-mode #controlsToggle{display:flex;align-items:center;justify-content:center}
body.controls-collapsed header{display:none}
body.controls-collapsed{grid-template-rows:0 minmax(0,1fr)}
#galleryTitle{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
</style>
</head>
<body>
<header>
<span id="galleryTitle" aria-label="Gallery title" hidden></span>
<div id="choosePrompt">
  <button id="choose" type="button" aria-describedby="chooseBubble">Choose folder</button>
  <div id="chooseBubble" role="note" hidden><span>Choose a photo folder to create/open a gallery.</span></div>
</div>
<select id="recentFolders" aria-label="Recently opened folders" title="Previously opened local folders" hidden></select>
<div id="restorePrompt" hidden>
  <button id="restoreLast" type="button" aria-describedby="restoreBubble"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8m-3-3 3 3-3 3"/></svg><span>Reopen gallery</span></button>
  <div id="restoreBubble" role="note"><strong id="restoreBubbleFolder"></strong><span>Click Reopen to grant access to the last gallery.</span></div>
</div>
<button id="scan" disabled title="Select a source folder to scan all subfolders, generate thumbnails and compressed JPEG copies">Refresh all photos</button>
<label for="concurrency">Parallel JPEGs</label><select id="concurrency" title="Number of JPEG Web Workers"></select><label for="thumbSize">Thumbnail size</label><select id="thumbSize" title="Thumbnail longest side in pixels"><option value="258">258 px</option><option value="320">320 px</option><option value="384" selected>384 px</option><option value="512">512 px</option></select><label for="thumbQuality">JPEG quality</label><select id="thumbQuality" title="Thumbnail JPEG encoding quality"><option value="30">30%</option><option value="40">40%</option><option value="50" selected>50%</option><option value="60">60%</option><option value="70">70%</option><option value="80">80%</option></select><label for="benchmark"><input type="checkbox" id="benchmark"> Re-encode (benchmark)</label>
<span id="status" role="status">Loading gallery…</span>
</header>
<div id="workspace"><div id="map"></div><aside id="folders" aria-label="Photo folders"><div id="folderTitle"><span id="folderTitleLabel">Folders</span><button id="controlsToggle" type="button" aria-label="Hide controls" aria-expanded="true" title="Hide controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg></button></div><nav id="folderList" aria-label="Choose folder"></nav><div id="folderHint">All folders are indexed; only the selected folder is rendered</div></aside></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
<button class="vbtn" id="download" aria-label="Download photo" title="Download photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button>
<button class="vbtn" id="deletePhoto" aria-label="Delete photo from gallery" title="Delete photo from gallery"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/></svg></button>
<button class="vbtn close" id="close" aria-label="Close" title="Close">×</button>
<button class="vbtn prev" id="prev" aria-label="Previous photo" title="Previous photo">‹</button>
<div id="viewerStage">
  <img id="viewerImage" class="viewer-photo" alt=""><img id="viewerImageNext" class="viewer-photo" alt="">
  <div id="viewerLoading" hidden><div class="spinner" role="status" aria-label="Loading photo"></div></div>
  <div id="viewerError" hidden></div>
</div>
<button class="vbtn next" id="next" aria-label="Next photo" title="Next photo">›</button>
<div id="viewerCaption"></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const status=$('status');
const isHttp=location.protocol==='http:'||location.protocol==='https:';
if(isHttp)document.body.classList.add('http-mode');
else if(location.protocol==='file:')document.body.classList.add('local-mode');
function toggleControls(){
 const collapsed=document.body.classList.toggle('controls-collapsed');
 $('controlsToggle').setAttribute('aria-expanded',String(!collapsed));
 $('controlsToggle').setAttribute('aria-label',collapsed?'Show controls':'Hide controls');
 $('controlsToggle').title=collapsed?'Show controls':'Hide controls';
 requestAnimationFrame(()=>map.updateSize());
}
$('controlsToggle').onclick=toggleControls;
function setControlsCollapsed(collapsed){
 document.body.classList.toggle('controls-collapsed',collapsed);
 $('controlsToggle').setAttribute('aria-expanded',String(!collapsed));
 $('controlsToggle').setAttribute('aria-label',collapsed?'Show controls':'Hide controls');
 $('controlsToggle').title=collapsed?'Show controls':'Hide controls';
 requestAnimationFrame(()=>map.updateSize());
}

let galleryName='';
function setGalleryName(name){
 galleryName=typeof name==='string'?name.trim():'';
 $('galleryTitle').textContent=galleryName;
 $('galleryTitle').hidden=!galleryName;
 document.title=galleryName?`${galleryName} — PhotoMap`:'PhotoMap';
}
const source=new ol.source.Vector();
const popupEl=document.createElement('div');popupEl.className='popup';
const popup=new ol.Overlay({element:popupEl,autoPan:{animation:{duration:180}}});
// When opened from file://, a normal image request cannot provide an HTTP Referer.
// Identify PhotoMap to the OSM tile service using the X-Requested-With header.
const osmSource = new ol.source.OSM({
  referrerPolicy: 'strict-origin-when-cross-origin'
});
if (location.protocol === 'file:') {
  osmSource.setTileLoadFunction((tile, src) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', src, true);
    xhr.responseType = 'blob';
    xhr.setRequestHeader('X-Requested-With', 'PhotoMap');

    xhr.onload = () => {
      if (xhr.status !== 200 || !xhr.response) {
        console.warn('OSM tile request failed:', xhr.status, src);
        return;
      }
      const objectUrl = URL.createObjectURL(xhr.response);
      const image = tile.getImage();
      const release = () => {
        image.removeEventListener('load', release);
        image.removeEventListener('error', release);
        URL.revokeObjectURL(objectUrl);
      };
      image.addEventListener('load', release);
      image.addEventListener('error', release);
      image.src = objectUrl;
    };
    xhr.onerror = () => console.warn('OSM tile network/CORS error:', src);
    xhr.send();
  });
}
const map=new ol.Map({target:'map',layers:[new ol.layer.Tile({source:osmSource}),new ol.layer.Vector({source})],overlays:[popup],view:new ol.View({center:ol.proj.fromLonLat([0,0]),zoom:2})});
// gallery.json is the persistent photo index. IndexedDB stores only local directory handles and the most recently used directory.
let directory=null,items=[],viewerIndex=-1,viewerRequest=0,scanGeneration=0;
let activeFolder='',activeIndices=[],folderGeneration=0,folderInventory=new Map(),loadingFolder=false;
let directoryIsExport=false,legacyDirectoryLayout=false;
let scanInProgress=false;
// Tombstones are retained in gallery.json so a refresh never reimports
// a source photo that the user intentionally removed from the gallery.
const deletedRecords=new Map();
let indexWriteQueue=Promise.resolve();
let deleteInProgress=false;
// During a scan, retain published metadata without rebuilding the currently
// displayed map for changes in other folders.
let scanPublished=null, publishedRevision=0, loadedRevision=0;
function updateScanAvailability(){
 const available=!!directory && !directoryIsExport && !scanInProgress;
 $('scan').disabled=!available;
 $('scan').title=available?'Scan all subfolders, generate thumbnails and compressed JPEG copies':'Select a source folder to refresh photos';
}

const folderProgress=new Map(); // folder -> {done,total}; only active scanning folders have entries
const folderProgressElements=new Map();
const pendingThumbBlobs=new Map();
const scannedFolders=new Set();
let scanReady=false;
let scanStatusKnown=false; // true when inventory has established which folders require processing
// Only thumbnails for the selected folder are retained as object URLs; all are pre-generated on disk.

const DEFAULT_THUMB_SIZE=384,DEFAULT_THUMB_QUALITY=.50;
// Pica 10.0.3 runs in the existing JPEG Web Workers (no nested Pica worker pool).
const THUMB_RESIZER='pica-mks2013-v2';
const THUMB_RESIZER_FALLBACK='canvas-high-fallback-v2';
const MARKER_SIZE=86,FADE_MS=260,JPEG_QUALITY=.60;
// These controls apply when refreshing the gallery; JPEG originals retain quality 60.
function thumbnailSettings(){
 return {size:Math.max(1,Number($('thumbSize').value)||DEFAULT_THUMB_SIZE), quality:(Number($('thumbQuality').value)||50)/100};
}
// Set the maximum parallel JPEG processing tasks here.
const MAX_PARALLEL_JPEGS = 4;
const DEFAULT_PARALLEL_JPEGS = 3;
function setupConcurrencyOptions(){
 const select=$('concurrency');
 select.replaceChildren();
 for(let n=1;n<=MAX_PARALLEL_JPEGS;n++){
  const option=document.createElement('option');
  option.value=String(n);
  option.textContent=n===1?'1 (baseline)':String(n);
  select.append(option);
 }
 select.value=String(Math.min(DEFAULT_PARALLEL_JPEGS,MAX_PARALLEL_JPEGS));
}
setupConcurrencyOptions();
const EXPORT_DIRECTORY='.photomap';
// Local file:// directory history. Store structured-cloneable directory handles,
// never gallery photos or cached image data, in IndexedDB.
const LOCAL_DB_NAME='PhotoMapLocalFolders';
const LOCAL_DB_VERSION=1;
let localDb=null;
let recentFolderRecords=[];
let pendingRestoreId=null;
function openLocalDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(LOCAL_DB_NAME,LOCAL_DB_VERSION);
  request.onupgradeneeded=()=>{
   const db=request.result;
   if(!db.objectStoreNames.contains('folders'))db.createObjectStore('folders',{keyPath:'id'});
   if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings');
  };
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}
function dbGet(store,key){
 return new Promise((resolve,reject)=>{
  const tx=localDb.transaction(store,'readonly');
  const request=tx.objectStore(store).get(key);
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}
function dbAll(store){
 return new Promise((resolve,reject)=>{
  const request=localDb.transaction(store,'readonly').objectStore(store).getAll();
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}
function dbPut(store,value,key){
 return new Promise((resolve,reject)=>{
  const tx=localDb.transaction(store,'readwrite');
  tx.objectStore(store).put(value,key);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}
async function sameHandle(a,b){
 try{return await a.isSameEntry(b);}catch{return false;}
}
function dbDelete(store,key){
 return new Promise((resolve,reject)=>{
  const tx=localDb.transaction(store,'readwrite');
  tx.objectStore(store).delete(key);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}
// A source directory (for example, Kailash) already contains its exported
// .photomap/gallery.json. Do not also retain that same .photomap in Recent folders.
// Keep a standalone .photomap entry if no known parent has been selected.
async function removeNestedExportHistory(parentHandle){
 if(parentHandle.name===EXPORT_DIRECTORY)return;
 let exportHandle;
 try{exportHandle=await parentHandle.getDirectoryHandle(EXPORT_DIRECTORY);}
 catch(e){if(e.name!=='NotFoundError'&&e.name!=='NotAllowedError')console.warn('Could not inspect export folder:',e);return;}
 for(const entry of recentFolderRecords){
  if(entry.handle.name!==EXPORT_DIRECTORY)continue;
  if(await sameHandle(entry.handle,exportHandle)){
   await dbDelete('folders',entry.id);
  }
 }
}
async function rememberLocalDirectory(handle){
 if(location.protocol!=='file:'||!localDb)return;
 try{
  let record=null;
  for(const entry of recentFolderRecords){
   if(await sameHandle(entry.handle,handle)){record=entry;break;}
  }
  const id=record?.id||('folder-'+crypto.randomUUID());
  const updated={id,name:handle.name,handle,lastOpened:Date.now()};
  await dbPut('folders',updated);
  await dbPut('settings',id,'lastFolderId');
  await removeNestedExportHistory(handle);
  pendingRestoreId=null;
  $('restorePrompt').hidden=true;
  await refreshRecentFolders(id);
 }catch(e){console.warn('Could not remember local folder:',e);}
}
async function refreshRecentFolders(selectedId=null){
 if(!localDb)return;
 recentFolderRecords=(await dbAll('folders')).sort((a,b)=>b.lastOpened-a.lastOpened);
 const select=$('recentFolders');select.replaceChildren();
 const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Recent folders…';select.append(placeholder);
 for(const record of recentFolderRecords){
  const option=document.createElement('option');option.value=record.id;
  option.textContent=record.name;option.title=record.name;
  select.append(option);
 }
 select.hidden=recentFolderRecords.length===0;
 select.value=selectedId||'';
}
async function openRememberedFolder(record,requestPermission=false){
 const handle=record.handle;
 let permission=await handle.queryPermission({mode:'read'});
 if(permission!=='granted'&&requestPermission){
  try{
   permission=await handle.requestPermission({mode:'read'});
  }catch(e){
   // Some browsers require a user gesture for a permission request.
   // Keep the Reopen button available in that case.
   console.info('Automatic folder permission request unavailable:',e);
   return false;
  }
 }
 if(permission!=='granted')return false;
 // Restoring a remembered folder only reads gallery.json; it never silently
 // rescans sources or requests write access on startup.
 const previousDirectory=directory;
 const previousExport=directoryIsExport;
 const previousLegacy=legacyDirectoryLayout;
 const previousItems=items;
 try{
  directory=handle;directoryIsExport=false;legacyDirectoryLayout=false;
  if(!await loadIndexFromDirectory(handle)){
   directory=previousDirectory;directoryIsExport=previousExport;legacyDirectoryLayout=previousLegacy;
   status.textContent='No gallery.json found in '+handle.name+'. Use Refresh all photos to create one.';
   return false;
  }
  pendingRestoreId=null;
  $('restorePrompt').hidden=true;
  status.textContent=`Restored gallery “${handle.name}” from gallery.json.`;
  await rememberLocalDirectory(handle);
  return true;
 }catch(e){
  directory=previousDirectory;directoryIsExport=previousExport;legacyDirectoryLayout=previousLegacy;
  status.textContent='Could not restore '+handle.name+': '+e.message;

  catch(e){deletedRecords.delete(path);throw e;}
  const pos=activeIndices.indexOf(index);
  const nextIndex=activeIndices.length>1?activeIndices[(pos+1)%activeIndices.length]:-1;
  const nextPath=nextIndex>=0?photoPath(items[nextIndex]):null;
  const folder=activeFolder;
  closeViewer(false);
  if(nextPath)rememberPhoto(nextIndex);else rememberFolder(folder);
  setItems(items.filter(i=>photoPath(i)!==path),folder);
  // A deletion may overlap a scan of the same folder; its tombstone takes precedence.
  const cleanup=await Promise.allSettled([
   deletePortableCopy(exportRoot,'images',item),
   deletePortableCopy(exportRoot,'thumbnails',item)
  ]);
  const failures=cleanup.filter(r=>r.status==='rejected');
  if(failures.length){
   console.warn('Photo removed from index, but some exported files could not be deleted:',path,failures);
   status.textContent='Photo removed from gallery; some exported files could not be deleted (see console).';
  }
 }catch(e){console.error('Could not remove photo:',path,e);alert('Could not remove photo: '+e.message);}
 finally{deleteInProgress=false;$('deletePhoto').disabled=false;refreshDeleteControls();}
}

async function init(){
 // HTTP(S): gallery.json alongside index.html is authoritative. No IndexedDB.
 if(location.protocol==='http:'||location.protocol==='https:'){
  try{
   const response=await fetch(new URL('gallery.json',location.href),{cache:'no-cache'});
   if(response.status===404){
    // First launch: no gallery has been generated yet.
    status.textContent='';
    $('chooseBubble').hidden=false;
    updateScanAvailability();
    return;
   }
   if(!response.ok)throw Error('HTTP '+response.status);
   directory=null;directoryIsExport=true;legacyDirectoryLayout=false;updateScanAvailability();
   await loadIndex(await response.json());
   setControlsCollapsed(true);
   $('chooseBubble').hidden=true;
   return;
  }catch(e){
   console.warn('Could not load gallery.json:',e);
   status.textContent='Could not load gallery.json: '+e.message;
   return;
  }
 }
 if(location.protocol==='file:'){
  await initLocalFolderHistory();
  return;
 }
 status.textContent='Choose a gallery folder to open gallery.json.';
}
void init();
</script>
